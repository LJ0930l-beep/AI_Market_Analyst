[project]
name = "ai-market-analyst"
version = "0.2.0"
description = "Local-first Phase 2 market research, news, Ollama analysis, and paper tracking"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
market = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
