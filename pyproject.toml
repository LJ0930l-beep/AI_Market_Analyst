[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-market-analyst"
version = "1.1.0"
description = "Local-first market research, news, Ollama analysis, and paper tracking"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
market = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]
exclude = ["data*", "docs*", "tests*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
